separator=false
markup=pango

[mediaplayer]
command=~/.config/i3/scripts/mediaplayer
interval=5
signal=10
separator=true
separator_block_width=20

[volume]
interval=1
color=#cdd6f4
command=~/.config/i3/scripts/volume

[network]
interval=5
color=#cdd6f4
command=~/.config/i3/scripts/network

[battery]
label=
color=#cdd6f4
interval=30
command=~/.config/i3/scripts/battery

[calendar]
interval=1
command=~/.config/i3/scripts/calendar
